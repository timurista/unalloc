[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unalloc"
version = "0.2.3"
description = "Find the AI spend nobody owns. Joins OpenCost allocation data with LLM provider bills and reports what's unattributed."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Timothy Urista" }]
keywords = ["finops", "kubernetes", "opencost", "cost-attribution", "llm", "llmops", "showback"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]
# Case studies, notebook and paper build. Not needed to use the CLI.
research = [
  "torch>=2.3",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "typst>=0.13",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "psycopg[binary]>=3.2",
  "markdown>=3.6",
]

[project.urls]
Homepage = "https://github.com/timurista/unalloc"
Issues = "https://github.com/timurista/unalloc/issues"
Changelog = "https://github.com/timurista/unalloc/blob/main/CHANGELOG.md"
Paper = "https://github.com/timurista/unalloc/blob/main/paper/unalloc-case-studies.pdf"
Explorer = "https://timurista.github.io/unalloc/"

[project.scripts]
unalloc = "unalloc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/unalloc"]

# Keep the sdist to the library: case studies, paper, blog and results live in
# the repository, not in the package users install.
[tool.hatch.build.targets.sdist]
include = ["src", "tests/*.py", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The notebook is generated from case_studies/notebook_exec.py, which is linted.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]
# Figure labels and page copy use real typographic signs ("36×", "÷", "12–14").
allowed-confusables = ["×", "÷", "–"]

[tool.ruff.lint.per-file-ignores]
# HTML page templates; wrapping them for line length hurts more than it helps.
"docs_build/__main__.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
